# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
when@dev:
    liip_imagine:
        # valid drivers options include "gd" or "gmagick" or "imagick"
        driver: "gd"

        loaders:
            asset_mapper:
                asset_mapper: ~
            chain:
                chain:
                    loaders: [asset_mapper, default]
        data_loader: chain

        resolvers:
            default:
                web_path:
                    web_root: '%kernel.project_dir%/public'
                    cache_prefix: 'media/cache'
        
        filter_sets:
            cache: ~
            compress:
                cache: format_extension # specifies the format_extension resolver @link https://symfony.com/bundles/LiipImagineBundle/current/cache-resolver/format_extension.html
                quality: 75
                format: webp
                filters: []
